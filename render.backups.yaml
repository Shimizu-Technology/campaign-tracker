# Render backup cron blueprint example for Campaign Tracker.
#
# Dependency note:
# - The backup script referenced below is added in PR #116:
#   ./scripts/backups/backup_postgres.sh
# - Merge PR #116 before this blueprint is applied in Render,
#   or merge both PRs together and deploy after both are on staging/main.
services:
  - type: cron
    name: campaign-tracker-db-backup
    runtime: native
    plan: starter
    branch: staging
    schedule: "0 16 * * *" # Daily at 2:00 AM Guam / 16:00 UTC
    autoDeploy: false
    startCommand: ./scripts/backups/backup_postgres.sh
    envVars:
      - key: DATABASE_URL
        sync: false # Set from Neon connection string in Render UI
      - key: BACKUP_STORAGE_PROVIDER
        value: s3
      - key: BACKUP_BUCKET
        value: your-backup-bucket-name
      - key: BACKUP_PREFIX
        value: campaign-tracker/production
      - key: AWS_REGION
        value: us-west-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_FILENAME_PREFIX
        value: campaign-tracker
      - key: BACKUP_ALERT_WEBHOOK_URL
        sync: false # Optional: Slack/Discord/other webhook for failure alerts
